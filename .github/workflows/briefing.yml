name: Briefing quotidien

on:
  schedule:
    - cron: "0 5 * * *"   # 5h UTC = 7h à Paris l'été, 6h l'hiver
  workflow_dispatch:       # bouton « Run workflow » pour tester

permissions:
  contents: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install feedparser
      - name: Générer le briefing
        env:
          # none = gratuit sans IA (défaut) | gemini = gratuit avec résumés en français | claude = payant
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'none' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python briefing.py
      - name: Publier la page
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add docs seen.json
          git diff --staged --quiet || git commit -m "Briefing $(date +%F)"
          git push
